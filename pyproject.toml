[project]
name = "deep-reading"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "beautifulsoup4>=4.13,<5",
    "markdownify>=1.2,<2",
    "defusedxml>=0.7,<1",
]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
